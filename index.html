<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FreeStand × Vaseline · Demo Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--nv:#0B2457;--nv2:#13336F;--nv3:#1D4690;--gd:#C9A24A;--gd2:#E8CF8A;--gdl:#FBF4E2;--cr:#FBF8F1;--ink:#14213D;--mut:#5D6B86;--line:#E1E6EF;--ok:#1E8E4E;--oks:#E4F5EA;--bad:#C83A2B;--bads:#FBE7E4;--wa:#075E54;--wa2:#25D366;--wabg:#EFE7DC;--fs:#FA6600;--bg:#EDF1F8}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:Poppins,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{display:flex;flex-direction:column}
button{font-family:inherit}
#hub{display:flex;flex:1;min-height:0}
#side{width:226px;flex-shrink:0;display:flex;flex-direction:column;padding:0 0 0 20px}
.brand{padding:30px 0 18px}.brand img{height:22px;display:block}.brand .s{font-size:8.5px;letter-spacing:2.2px;text-transform:uppercase;color:#8A97B8;margin-top:10px}
#demos{display:flex;flex-direction:column;gap:4px;padding-right:12px}
.dm{display:flex;gap:11px;align-items:center;padding:9px 8px;border-radius:9px;cursor:pointer}
.dm:hover{background:rgba(5,39,98,.05)}.dm.on{background:#E3E9F5}
.dm .n{width:30px;height:30px;border-radius:8px;border:1.5px solid rgba(5,39,98,.45);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--nv);flex-shrink:0;background:#F7F9FD}
.dm.on .n{background:var(--fs);border-color:var(--fs);color:#fff}
.dm .t{font-size:12.5px;font-weight:600;color:var(--nv);line-height:1.25}.dm .s{font-size:10.5px;color:#5a678c;margin-top:2px;line-height:1.3}
#now{margin:auto 24px 8px 0;background:#fff;border:1px solid #DDE3F0;border-radius:10px;padding:10px 12px}
#cnt{font-family:ui-monospace,monospace;font-size:11.5px;color:#5a678c}#lbl{font-size:12px;line-height:1.4;color:#43507a;margin-top:4px}
.foot{padding:4px 24px 16px 0;font-size:10.5px;color:#8A97B8;line-height:1.5}
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:24px 28px 10px 8px}
#fwrap{position:relative;border-radius:8px;overflow:hidden;box-shadow:0 10px 40px rgba(5,39,98,.10);background:#fff}
#frame{position:absolute;left:0;top:0;width:1280px;height:832px;transform-origin:0 0;overflow:hidden;background:#fff}
#bar{display:flex;align-items:center;gap:16px;padding:6px 28px 20px 32px}
#bar>button{background:var(--nv);color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;min-width:128px}
#bar>button:disabled{background:#c3cbdd;cursor:not-allowed}
#tabs{flex:1;display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.tb{display:flex;align-items:center;gap:8px;padding:8px 15px;border-radius:999px;border:1.5px solid #CBD3E6;background:#fff;color:#43507a;font-size:13px;font-weight:600;cursor:pointer}
.tb .n{width:20px;height:20px;border-radius:50%;background:#E6EBF5;font-size:11px;display:flex;align-items:center;justify-content:center}
.tb.on{background:var(--nv);border-color:var(--nv);color:#fff}.tb.on .n{background:var(--fs);color:#fff}
@media (max-width:900px){#side{display:none}#bar{padding:6px 10px 12px}#bar>button{min-width:0;padding:10px 14px}.tb{display:none}}

/* ===== frame content ===== */
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,162,74,.55)}50%{box-shadow:0 0 0 10px rgba(201,162,74,0)}}
@keyframes scan{0%{top:10%}50%{top:85%}100%{top:10%}}
@keyframes walk{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
.fu{animation:fu .45s both}.pop{animation:pop .35s both}
.F{position:absolute;inset:0}
.kick{font-size:10.5px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;color:var(--gd)}
.cap{position:absolute;left:28px;right:28px;bottom:18px;background:var(--nv);color:#fff;border-radius:14px;padding:12px 18px;display:flex;gap:14px;align-items:center;box-shadow:0 10px 30px rgba(11,36,87,.25)}
.cap .st{background:var(--gd);color:var(--nv);font-size:10.5px;font-weight:700;border-radius:6px;padding:4px 8px;letter-spacing:1px;flex-shrink:0}
.cap .t{font-size:14.5px;font-weight:600}.cap .s{font-size:11.5px;color:#C8D3EC;margin-top:2px;line-height:1.45}
.chtag{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:var(--gd);color:var(--nv);font-size:9.5px;font-weight:700;letter-spacing:1.6px;border-radius:999px;padding:5px 12px;text-transform:uppercase;z-index:5}

/* phone */
.ph{position:absolute;left:62px;top:28px;width:316px;height:654px;border-radius:44px;background:#111;padding:10px;box-shadow:0 0 0 2px #2b2b2e,0 22px 50px rgba(11,36,87,.28)}
.ph .sc{width:100%;height:100%;border-radius:35px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
.sb{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:11px;font-weight:600}
.sb.dk{background:var(--wa);color:#fff}.sb.nv{background:var(--nv);color:#fff}
.url{display:flex;align-items:center;gap:6px;margin:4px 10px 6px;background:#F1F3F6;border-radius:999px;padding:6px 12px;font-size:10px;color:#3d4a63;flex-shrink:0}
.url b{font-weight:500}
.pg{flex:1;overflow:hidden;position:relative;background:#fff}
.nav{height:38px;flex-shrink:0;display:flex;justify-content:space-around;align-items:center;border-top:1px solid #eee;color:#8b95a7;font-size:13px}
/* vaseline site */
.vh{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #eef0f4}
.vh img{height:24px}.vh .m{font-size:8.5px;color:var(--nv);display:flex;gap:9px;font-weight:500}
.vhero{background:linear-gradient(120deg,#0A2150,#173E86);color:#fff;padding:14px 14px 12px;position:relative;overflow:hidden}
.vhero:after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,#B98F3A,#F2E1A6,#B98F3A)}
.vhero .k{font-size:7.5px;letter-spacing:1.6px;color:var(--gd2);font-weight:600}
.vhero .h{font-size:17px;font-weight:600;line-height:1.15;margin-top:4px;letter-spacing:-.2px}
.vhero .p{font-size:9px;opacity:.85;margin-top:5px;line-height:1.45}
.fm{padding:12px 14px}
.fm .stp{font-size:8px;letter-spacing:1.4px;color:var(--gd);font-weight:700}
.fm .q{font-size:13.5px;font-weight:600;color:var(--nv);margin:4px 0 10px;line-height:1.3}
.in{border:1.5px solid #D5DCE8;border-radius:9px;padding:7px 10px;font-size:11px;margin-bottom:7px;color:var(--ink);background:#fff}
.in small{display:block;font-size:8px;color:var(--mut)}
.in.on{border-color:var(--nv3);box-shadow:0 0 0 3px rgba(29,70,144,.12)}
.op{border:1.5px solid #D5DCE8;border-radius:9px;padding:8px 10px;font-size:11px;margin-bottom:6px;display:flex;align-items:center;gap:8px;background:#fff}
.op i{width:13px;height:13px;border-radius:50%;border:1.5px solid #A9B4C8;flex-shrink:0}
.op.sq i{border-radius:3px}
.op.on{border-color:var(--nv3);background:#EEF3FC;font-weight:600;color:var(--nv)}
.op.on i{border:4px solid var(--nv3)}.op.sq.on i{border:none;background:var(--nv3)}
.btn{display:block;text-align:center;background:var(--nv);color:#fff;border-radius:10px;padding:10px;font-size:11.5px;font-weight:600;margin-top:8px}
.btn.gd{background:linear-gradient(90deg,#B98F3A,#D9B865);color:#0B2457}
.btn.wa{background:var(--wa2)}
.fine{font-size:8px;color:#8b95a7;text-align:center;margin-top:7px;line-height:1.4}
.chk{display:flex;gap:6px;align-items:flex-start;font-size:8.5px;color:#4a5670;margin-top:6px;line-height:1.35}.chk b{width:11px;height:11px;border-radius:3px;background:var(--nv3);flex-shrink:0;margin-top:1px}
.otp{display:flex;gap:7px;margin:4px 0}.otp div{flex:1;height:40px;border:1.5px solid #D5DCE8;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;color:var(--nv)}
.otp.f div{border-color:var(--nv3)}
.prog{height:4px;background:#EEF1F6;border-radius:3px;margin-bottom:10px;overflow:hidden}.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--nv3),var(--gd))}
.wt{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#4a5670;margin:7px 0}.wt .sp{width:14px;height:14px;border-radius:50%;border:2px solid #D5DCE8;border-top-color:var(--nv3);animation:spin .8s linear infinite}.wt .ok{width:14px;height:14px;border-radius:50%;background:var(--ok);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center}
/* whatsapp */
.wah{background:var(--wa);color:#fff;display:flex;align-items:center;gap:8px;padding:6px 10px 8px;flex-shrink:0}
.wah .av{width:28px;height:28px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}.wah .av img{width:26px}
.wah .n{font-size:11.5px;font-weight:600}.wah .v{font-size:8.5px;opacity:.8}
.wab{flex:1;background:var(--wabg);overflow:hidden;padding:8px 9px;display:flex;flex-direction:column;justify-content:flex-end;gap:5px;position:relative}
.wab .day{align-self:center;background:#E1F2FB;color:#4a5670;font-size:8.5px;border-radius:6px;padding:3px 8px;margin:3px 0}
.m{max-width:84%;font-size:10px;line-height:1.42;padding:6px 8px 4px;border-radius:8px;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.m.i{background:#fff;align-self:flex-start;border-top-left-radius:2px}.m.o{background:#D9FDD3;align-self:flex-end;border-top-right-radius:2px}
.m .tm{font-size:7.5px;color:#8b95a7;text-align:right;margin-top:1px}
.m .bt{border-top:1px solid #eef0f2;margin:6px -8px -4px;display:flex;flex-direction:column}
.m .bt span{color:#0A84C6;text-align:center;font-size:9.5px;font-weight:500;padding:5px 0;border-bottom:1px solid #eef0f2}.m .bt span:last-child{border-bottom:none}
.m .bt span.sel{background:#E8F4FB}
.m img.ph2{width:100%;border-radius:6px;display:block;margin-bottom:4px}
.m.new{animation:fu .4s both}
.wai{height:40px;background:#F0F2F5;display:flex;align-items:center;gap:6px;padding:0 8px;flex-shrink:0}.wai div{flex:1;background:#fff;border-radius:99px;height:26px;font-size:9px;color:#9aa3b3;display:flex;align-items:center;padding:0 10px}.wai b{width:26px;height:26px;border-radius:50%;background:var(--wa2)}
.prodcard{display:flex;gap:7px;align-items:center;background:#F6F7F9;border-radius:6px;padding:5px;margin-bottom:4px}
/* right panel */
.rp{position:absolute;left:418px;right:28px;top:28px;bottom:118px;border:2.5px solid var(--nv);border-radius:16px;background:#fff;overflow:hidden;display:flex;flex-direction:column}
.rp.free{border:none;bottom:118px}
.rph{display:flex;align-items:center;gap:12px;padding:16px 20px 10px}
.rph .ic{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--nv);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.rph .t{font-size:18px;font-weight:600;color:var(--ink)}.rph .s{font-size:10.5px;color:var(--mut)}
.rph .syn{margin-left:auto;font-size:10px;color:var(--mut);letter-spacing:1px;display:flex;align-items:center;gap:6px}.rph .syn:before{content:"";width:7px;height:7px;border-radius:50%;background:#3BC46A}
.ptabs{display:flex;gap:22px;padding:0 20px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut)}.ptabs span{padding:8px 0}.ptabs span.on{color:var(--nv);border-bottom:2px solid var(--fs);font-weight:500}
.pid{display:flex;gap:18px;padding:14px 20px 4px;align-items:center}
.ava{width:118px;height:118px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:600;color:#fff;flex-shrink:0;background:linear-gradient(140deg,#1D4690,#C9A24A)}
.ava.q{background:#EEF1F6;color:#B5BED0;border:1px solid var(--line)}
.pf{flex:1}.pf div{display:flex;border-bottom:1px solid #EEF1F6;padding:10px 0;font-size:12px}.pf div span{width:96px;color:var(--mut)}.pf div b{font-weight:500}
.pf .emp{display:inline-block;width:240px;height:9px;border-radius:5px;background:#EEF1F6;margin-top:4px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:10px 20px 14px;flex:1;min-height:0}
.chips h5{margin:0 0 7px;font-size:10px;letter-spacing:1.3px;color:var(--nv);font-weight:700}
.cbox{border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;height:calc(100% - 20px);overflow:hidden}
.cp{font-size:10px;border-radius:6px;padding:4px 8px;background:#E7EDF8;color:#24365e}
.cp.y{background:#FCEFD9;color:#6b4b10}.cp.g{background:#E2F3E8;color:#1E5E36}.cp.p{background:#EDE6F8;color:#4b347a}.cp.r{background:#FBE4E1;color:#8A2B1E}
.cp.new{animation:pop .4s both;outline:2px solid var(--fs);outline-offset:1px}
.empty{font-size:10px;color:#A3ACBF;font-style:italic}
/* check panel */
.cpn{padding:4px 20px 14px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0;overflow:hidden}
.ck{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#FAFBFD;opacity:.45;transition:all .3s}
.ck .ic{width:22px;height:22px;border-radius:50%;flex-shrink:0;border:2.5px solid #D5DCE8;border-top-color:var(--nv3);animation:spin .8s linear infinite}
.ck .t{font-size:12px;font-weight:600}.ck .s{font-size:10.5px;color:var(--mut);margin-top:1px}
.ck .r{margin-left:auto;font-size:10.5px;font-weight:600;color:var(--mut);white-space:nowrap}
.ck.ok{opacity:1;background:var(--oks);border-color:#C3E6CF}.ck.ok .ic{animation:none;border:none;background:var(--ok);display:flex;align-items:center;justify-content:center}.ck.ok .ic:after{content:"✓";color:#fff;font-size:12px;font-weight:700}.ck.ok .r{color:var(--ok)}
.ck.no{opacity:1;background:var(--bads);border-color:#F2C6BF}.ck.no .ic{animation:none;border:none;background:var(--bad);display:flex;align-items:center;justify-content:center}.ck.no .ic:after{content:"✕";color:#fff;font-size:11px;font-weight:700}.ck.no .r{color:var(--bad)}
.ck.warn{opacity:1;background:#FFF7E6;border-color:#F3DFAE}.ck.warn .ic{animation:none;border:none;background:#E0A21B}
.sbx{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.sbx div{border-radius:10px;padding:10px 12px;background:var(--oks);border:1px solid #C3E6CF}.sbx small{display:block;font-size:9px;letter-spacing:1.2px;color:var(--mut);font-weight:600}.sbx b{font-size:14px;color:var(--ok)}.sbx span{display:block;font-size:10px;color:var(--mut);margin-top:2px}
.tagrow{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:10px;border-radius:999px;padding:3px 10px;background:#FCEFD9;color:#6b4b10;font-weight:500}
/* generic cards */
.cd{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.cd h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--ink);display:flex;justify-content:space-between}.cd h4 i{font-style:normal;font-weight:400;color:#97A1B5;font-size:10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.hb{display:flex;align-items:center;gap:8px;margin-bottom:7px;font-size:11px}.hb .n{width:150px;flex-shrink:0;color:#334155;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .tr{flex:1;height:9px;background:#F1F4F9;border-radius:5px;overflow:hidden}.hb .tr i{display:block;height:100%;border-radius:5px;background:var(--nv3)}.hb .v{width:62px;text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
/* scene (offline) */
.scn{position:absolute;inset:0;background:linear-gradient(180deg,#EEF2F8 0%,#E6ECF5 62%,#D9DFE9 62%,#CFD6E2 100%)}
.scn .top{position:absolute;left:0;right:0;top:0;height:34px;background:var(--nv);color:#E8CF8A;font-size:10.5px;letter-spacing:3px;font-weight:600;display:flex;align-items:center;justify-content:center}
.glass{position:absolute;top:60px;width:120px;height:330px;background:linear-gradient(180deg,#DCE7F5,#C7D6EA);border:3px solid #B4C3D9;border-radius:4px}
.glass:after{content:"";position:absolute;left:20%;top:0;bottom:0;width:18px;background:rgba(255,255,255,.45);transform:skewX(-8deg)}
.lift{position:absolute;top:70px;width:150px;height:320px;background:#C2CBD8;border:5px solid #9AA6B8}.lift:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:#8D98AA}
.stall{position:absolute;left:250px;top:120px;width:470px;height:450px}
.canopy{position:absolute;left:-12px;right:-12px;top:0;height:50px;border-radius:6px 6px 0 0;background:repeating-linear-gradient(90deg,var(--nv) 0 47px,#C9A24A 47px 94px);box-shadow:0 6px 0 rgba(0,0,0,.08)}
.canopy:after{content:"";position:absolute;left:0;right:0;bottom:-12px;height:12px;background:radial-gradient(circle at 23px 0,var(--nv) 23px,transparent 24px) 0 0/94px 12px,radial-gradient(circle at 23px 0,#C9A24A 23px,transparent 24px) 47px 0/94px 12px;background-repeat:repeat-x}
.pole{position:absolute;top:50px;width:9px;height:240px;background:#1C2F55}
.counter{position:absolute;left:0;right:0;top:250px;height:150px;background:linear-gradient(180deg,#0E2B66,#0A2150);border-top:7px solid #C9A24A;border-radius:0 0 6px 6px;display:flex;align-items:center;gap:16px;padding:0 26px;color:#fff}
.counter img{height:58px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.counter .t{font-size:21px;font-weight:700;letter-spacing:.5px}.counter .s{font-size:9.5px;letter-spacing:2.6px;color:var(--gd2);margin-top:3px}
.floor{position:absolute;left:260px;top:600px;width:450px;height:150px;border:2px dashed #E3BBA0;border-radius:6px;background:rgba(252,233,220,.35)}
.bub{position:absolute;background:#fff;border:2px solid var(--nv);border-radius:12px;padding:9px 12px;font-size:11px;font-weight:600;line-height:1.4;color:var(--ink);box-shadow:0 8px 20px rgba(11,36,87,.15);animation:pop .4s both}
.bub:after{content:"";position:absolute;bottom:-9px;left:40px;width:14px;height:14px;background:#fff;border-right:2px solid var(--nv);border-bottom:2px solid var(--nv);transform:rotate(45deg)}
.qrcard{position:absolute;background:#fff;border-radius:14px;box-shadow:0 14px 34px rgba(11,36,87,.22);overflow:hidden}
.qrcard .h{background:var(--nv);color:#fff;font-size:10px;letter-spacing:1.6px;font-weight:600;text-align:center;padding:8px}
.stand{position:absolute;background:#fff;border:3px solid #DCE2EC;border-radius:4px;box-shadow:0 8px 18px rgba(0,0,0,.1);overflow:hidden}
.walkin{animation:walk .8s both}
/* console */
.con{position:absolute;inset:0;display:grid;grid-template-columns:200px 1fr;background:#F6F8FB}
.con .rail{background:var(--nv);padding:16px 12px;color:#9FB0D6;font-size:11.5px}
.con .rail img{height:18px;filter:brightness(0) invert(1);margin:2px 6px 18px}
.con .rail div{padding:7px 9px;border-radius:7px;margin-bottom:2px;display:flex;gap:8px;align-items:center}.con .rail div.on{background:rgba(255,255,255,.12);color:#fff;font-weight:500}
.con .rail .sec{font-size:9px;letter-spacing:1.6px;color:#6E80AE;text-transform:uppercase;padding:12px 9px 4px;background:none}
.con .mn{padding:18px 24px;overflow:hidden;display:flex;flex-direction:column;gap:12px;min-width:0}

/* ───────── hub engine ───────── */
const DEMOS=[{t:"Claim to loyalty · online",s:"Meta ad → vaseline.in → WhatsApp → Skin Diary",steps:ONLINE,tabs:["Set-up","Customer journey","Beyond sampling","Analytics"]},
             {t:"Promoter sampling · offline",s:"Office-lobby stall → WhatsApp pass → Skin Diary",steps:OFFLINE,tabs:["At the stall","Claim & hand-over","Feedback & loyalty","Analytics"]}];
let D=0,I=0,timers=[];
function render(){
  timers.forEach(clearTimeout); timers=[];
  const d=DEMOS[D], s=d.steps[I];
  document.getElementById("frame").innerHTML='<div class="F">'+s.r()+'</div>';
  document.getElementById("cnt").textContent=(I+1)+" / "+d.steps.length;
  document.getElementById("lbl").textContent=s.l;
  document.getElementById("prev").disabled=(D===0&&I===0);
  document.getElementById("next").disabled=(D===DEMOS.length-1&&I===d.steps.length-1);
  document.getElementById("demos").innerHTML=DEMOS.map((x,j)=>'<div class="dm'+(j===D?" on":"")+'" onclick="pickDemo('+j+')"><div class="n">'+(j+1)+'</div><div><div class="t">'+x.t+'</div><div class="s">'+x.s+'</div></div></div>').join("");
  document.getElementById("tabs").innerHTML=d.tabs.map((t,j)=>'<div class="tb'+(s.ch===j&&I>0?" on":"")+'" onclick="jumpCh('+j+')"><span class="n">'+(j+1)+'</span>'+t+'</div>').join("");
  document.querySelectorAll("#frame .ck").forEach(el=>{ const d=parseFloat(el.dataset.d)*1000; timers.push(setTimeout(()=>el.classList.add(el.dataset.res||"ok"),d)); });
  try{ location.hash=D+"-"+I; }catch(e){}
}
function go(n){ I=n; render(); }
function pickDemo(j){ D=j; I=0; render(); }
function jumpCh(c){ const k=DEMOS[D].steps.findIndex((s,i)=>i>0&&s.ch===c); if(k>=0){ I=k; render(); } }
function next(){ if(I<DEMOS[D].steps.length-1){I++;} else if(D<DEMOS.length-1){D++;I=0;} render(); }
function prev(){ if(I>0){I--;} else if(D>0){D--;I=DEMOS[D].steps.length-1;} render(); }
document.getElementById("next").onclick=next; document.getElementById("prev").onclick=prev;
document.addEventListener("keydown",e=>{ if(e.key==="ArrowRight")next(); else if(e.key==="ArrowLeft")prev(); });
document.getElementById("frame").addEventListener("click",e=>{ if(e.target.closest(".ph")) next(); });
function fit(){ const st=document.getElementById("stage"), W=st.clientWidth-36, H=st.clientHeight-34, k=Math.min(W/1280,H/832);
  const w=document.getElementById("fwrap"); w.style.width=(1280*k)+"px"; w.style.height=(832*k)+"px"; document.getElementById("frame").style.transform="scale("+k+")"; }
addEventListener("resize",fit);
(function(){ const m=(location.hash||"").match(/^#(\d)-(\d+)$/); if(m){ D=Math.min(+m[1],1); I=Math.min(+m[2],DEMOS[D].steps.length-1); } })();
fit(); render();
</script></body></html>
